name: Validate production build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify Hostinger Nitro artifact
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Smoke test production server
        run: |
          PORT=4173 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/portfolio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --output /tmp/portfolio-home.html http://127.0.0.1:4173/; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "Guilherme"
